<style>
  :root {
    --green-900: #1E231E; --green-700: #2D4A2B; --green-500: #4C6E48; --green-100: #DCE6D6;
    --sage-bg: #EDF1E7; --gold: #C9962C; --gold-dark: #9C7420; --gold-bg: #FBF1DD;
    --white: #FFFFFF; --ink: #1E231E; --ink-soft: #5A6156; --border: #D6DCCE;
    --danger: #B23A2E; --danger-bg: #FBEAE7; --success: #2D6A3E; --success-bg: #E2F1E4;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--sage-bg); color: var(--ink); min-height: 100vh; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 2rem; max-width: 1000px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-mark { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 700; color: var(--green-900); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .farmer-badge { display: flex; align-items: center; gap: 8px; }
  .farmer-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--gold); color: var(--green-900); font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .farmer-name { font-size: 13.5px; font-weight: 500; }
  .farmer-village { font-size: 11.5px; color: var(--ink-soft); }

  .subnav { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 46px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); max-width: 1000px; margin: 0 auto; }
  .subnav .current { color: var(--green-900); font-weight: 500; }

  main { max-width: 1000px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  .page-title { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 600; margin-bottom: 1.2rem; }

  .search-row { display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap; }
  .search-box { flex: 1; min-width: 220px; background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .search-box input { flex: 1; border: none; outline: none; font-size: 14px; font-family: 'Inter', sans-serif; background: transparent; }
  .locate-btn { background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .locate-btn:hover { border-color: var(--green-500); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 1.4rem; flex-wrap: wrap; }
  .filter-chip { font-size: 12.5px; font-weight: 500; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--white); color: var(--ink-soft); cursor: pointer; }
  .filter-chip.active { background: var(--green-700); color: var(--white); border-color: var(--green-700); }

  .view-toggle { display: flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; margin-bottom: 1.2rem; width: fit-content; }
  .view-btn { font-size: 12.5px; font-weight: 500; padding: 8px 16px; border: none; background: var(--white); color: var(--ink-soft); cursor: pointer; border-right: 1px solid var(--border); }
  .view-btn:last-child { border-right: none; }
  .view-btn.active { background: var(--green-700); color: var(--white); }

  .map-placeholder {
    display: none;
    background: var(--green-100);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    height: 260px;
    margin-bottom: 1.4rem;
    position: relative;
    overflow: hidden;
  }
  .map-placeholder.show { display: block; }
  .map-placeholder::before {
    content: "";
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(60deg, rgba(45,74,43,0.05) 0px, rgba(45,74,43,0.05) 2px, transparent 2px, transparent 30px);
  }
  .map-pin { position: absolute; font-size: 22px; z-index: 1; }
  .map-label {
    position: absolute; bottom: 12px; left: 12px; right: 12px;
    background: var(--white); border-radius: 9px; padding: 8px 12px;
    font-size: 12px; color: var(--ink-soft); z-index: 1;
  }

  .centre-list.hidden { display: none; }

  .centre-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1.3rem; margin-bottom: 12px; }
  .centre-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .centre-name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 1.05rem; color: var(--green-900); }
  .centre-addr { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .capacity-badge { font-size: 10.5px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .capacity-badge.available { background: var(--success-bg); color: var(--success); }
  .capacity-badge.almost { background: var(--gold-bg); color: var(--gold-dark); }
  .capacity-badge.full { background: var(--danger-bg); color: var(--danger); }

  .centre-meta-grid { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 12px; }
  .centre-meta-grid strong { display: block; color: var(--ink); font-size: 13.5px; margin-top: 2px; }

  .centre-actions { display: flex; gap: 8px; }
  .action-btn { flex: 1; padding: 9px; border-radius: 8px; font-size: 12.5px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--ink); }
  .action-btn.primary { background: var(--green-700); color: var(--white); border-color: var(--green-700); }
  .action-btn.primary:hover { background: var(--green-900); }
  .action-btn:hover { border-color: var(--green-500); }

  .empty-state, .denied-state { display: none; text-align: center; padding: 3rem 1rem; background: var(--white); border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty-state.show, .denied-state.show { display: block; }
  .empty-icon { font-size: 32px; margin-bottom: 10px; }
  .empty-title { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; }
  .empty-sub { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 1.1rem; }
  .btn { padding: 11px 20px; border-radius: 9px; font-size: 13.5px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; border: none; background: var(--green-700); color: var(--white); }
  .btn:hover { background: var(--green-900); }

  .demo-toggle { display: flex; gap: 8px; margin-bottom: 1.2rem; justify-content: flex-end; flex-wrap: wrap; }
  .demo-toggle button { font-size: 11.5px; font-family: 'Inter', sans-serif; padding: 6px 11px; border-radius: 7px; border: 1px solid var(--border); background: var(--white); color: var(--ink-soft); cursor: pointer; }
  .demo-toggle button.active { background: var(--green-900); color: var(--white); border-color: var(--green-900); }

  @media (max-width: 700px) {
    .topbar { padding: 1rem 1.25rem; }
    .subnav { padding: 0 1.25rem; overflow-x: auto; white-space: nowrap; }
    main { padding: 1.25rem 1.1rem 3rem; }
  }
</style>

<link rel="stylesheet" href="hindi-i18n.css">

<body>
<div class="topbar">
<div class="brand"><a aria-label="Farmer Queue home" href="page01-landing.html"><img alt="Farmer Queue" class="farmer-queue-logo" src="farmer-queue.png"/></a></div>
<div class="header-right">
<div class="farmer-badge">
<div class="farmer-avatar">SY</div>
<div><div class="farmer-name">Suresh Yadav</div><div class="farmer-village">Kheri Village</div></div>
</div>
</div>
</div>
<main>
<div class="page-title">Find a procurement centre</div>
<div class="empty-sub" id="finderMessage" role="status" aria-live="polite" style="margin:0 0 12px"></div>
<div class="search-row">
<div class="search-box">
<span>🔍</span>
<input aria-label="Search village, district, or centre name" id="searchInput" placeholder="Search village, district, or centre name" type="text"/>
</div>
<button class="locate-btn" id="locateBtn">📍 Use my location</button>
</div>
<div class="filter-row" id="filterRow">
<button class="filter-chip active" data-filter="all">All</button>
</div>
<div class="centre-list" id="centreList"></div>
<div class="empty-state" id="emptyState">
<div class="empty-icon">🔍</div>
<div class="empty-title">No centres found</div>
<div class="empty-sub">Try a different village, district, or clear your filters.</div>
<button class="btn" id="clearFiltersBtn">Clear filters</button>
</div>
<div class="denied-state" id="deniedState">
<div class="empty-icon">📍</div>
<div class="empty-title" id="deniedTitle">Location not available</div>
<div class="empty-sub" id="deniedText">Turn on location access in your browser settings, or search by village or district instead.</div>
<button class="btn" id="searchInsteadBtn">Search manually</button>
</div>
</main>
<script src="kq-app.js"></script>
<script>
(function () {
  'use strict';

  /*
   * Page 07 - centre finder. Centres, hours and accepted crops come from the backend:
   *   GET /api/mandis?includeCrops=true[&lat=&lng=&radiusKm=]   GET /api/crops
   * The farmer's position is requested ONLY when "Use my location" is pressed, is rounded, is kept in
   * memory only and is sent only to this app's own backend to sort by distance. It is never saved.
   * If permission is denied the page keeps working with search.
   */

  const $ = (id) => document.getElementById(id);
  let centres = [];
  let cropFilter = 'all';
  let usingLocation = false;
  let expanded = new Set();

  function setMessage(text, withRetry) {
    const box = $('finderMessage');
    box.textContent = text || '';
    if (withRetry) {
      const retry = document.createElement('button');
      retry.className = 'btn outline';
      retry.style.marginLeft = '10px';
      retry.textContent = 'Retry';
      retry.addEventListener('click', () => loadCentres(usingLocation ? KQ.lastLocation : null));
      box.appendChild(retry);
    }
  }

  function header() {
    if (KQ.isLoggedIn()) { KQ.mountAuthUI(); return; }
    const badge = document.querySelector('.farmer-badge');
    if (badge) badge.style.display = 'none';
    const host = document.querySelector('.header-right');
    if (host) {
      const link = document.createElement('a');
      link.href = 'page02a-farmer-login.html?next=page07-centre-finder.html';
      link.textContent = 'Log in';
      link.style.cssText = 'font-weight:700;color:#2D4A2B;text-decoration:none;padding:9px 14px;border:1px solid #c9d2c1;border-radius:9px;background:#fff;font-size:13px';
      host.appendChild(link);
    }
  }

  async function loadCrops() {
    try {
      const result = await KQ.api('/crops', { auth: false });
      const row = $('filterRow');
      (result.data || []).filter((c) => c.active !== false).forEach((crop) => {
        const chip = document.createElement('button');
        chip.className = 'filter-chip';
        chip.dataset.filter = String(crop.id);
        chip.textContent = 'Accepts ' + crop.name;
        row.appendChild(chip);
      });
      row.addEventListener('click', (event) => {
        const chip = event.target.closest('.filter-chip');
        if (!chip) return;
        row.querySelectorAll('.filter-chip').forEach((c) => c.classList.remove('active'));
        chip.classList.add('active');
        cropFilter = chip.dataset.filter;
        render();
      });
    } catch (error) {
      console.error('Crop filter error:', error);   // the list still works without crop filters
    }
  }

  async function loadCentres(location) {
    setMessage('Loading centres…');
    $('centreList').innerHTML = '';
    try {
      // With a location, radiusKm is huge so every centre is returned, nearest first, with its distance.
      const path = '/mandis?includeCrops=true' + (location
        ? '&lat=' + encodeURIComponent(location.latitude) + '&lng=' + encodeURIComponent(location.longitude) + '&radiusKm=20000'
        : '');
      const result = await KQ.api(path, { auth: false });
      centres = result.data || [];
      setMessage(location ? 'Showing centres nearest to you first. Your location is not saved.' : '');
      render();
    } catch (error) {
      console.error('Centre loading error:', error);
      centres = [];
      $('centreList').innerHTML = '';
      $('emptyState').classList.remove('show');
      setMessage(KQ.describeError(error, 'load procurement centres') + ' ', true);
    }
  }

  function matches(centre) {
    const term = $('searchInput').value.trim().toLowerCase();
    if (term && ![centre.name, centre.address, centre.district, centre.state].filter(Boolean).join(' ').toLowerCase().includes(term)) return false;
    if (cropFilter !== 'all' && !(centre.accepted_crops || []).some((c) => String(c.id) === cropFilter)) return false;
    return true;
  }

  function addLine(parent, label, value) {
    const cell = document.createElement('div');
    cell.appendChild(document.createTextNode(label));
    const strong = document.createElement('strong');
    strong.textContent = value;
    cell.appendChild(strong);
    parent.appendChild(cell);
  }

  function render() {
    const list = $('centreList');
    list.innerHTML = '';
    $('deniedState').classList.remove('show');
    const filtered = centres.filter(matches);

    filtered.forEach((centre) => {
      const card = document.createElement('div');
      card.className = 'centre-card';

      const top = document.createElement('div');
      top.className = 'centre-top';
      const info = document.createElement('div');
      const name = document.createElement('div');
      name.className = 'centre-name';
      name.textContent = centre.name;
      const addr = document.createElement('div');
      addr.className = 'centre-addr';
      addr.textContent = [centre.address, [centre.district, centre.state].filter(Boolean).join(', ')].filter(Boolean).join(' · ') +
        (centre.distance_km !== undefined ? ' · ' + centre.distance_km + ' km away' : '');
      info.appendChild(name);
      info.appendChild(addr);
      top.appendChild(info);
      card.appendChild(top);

      const grid = document.createElement('div');
      grid.className = 'centre-meta-grid';
      addLine(grid, 'Hours', centre.operating_hours || 'Not listed');
      addLine(grid, 'Accepts', (centre.accepted_crops || []).map((c) => c.name).filter(Boolean).join(', ') || 'No crops listed');
      if (expanded.has(centre.id)) {
        addLine(grid, 'Contact', centre.contact || 'Not listed');
        addLine(grid, 'Location', Number(centre.latitude).toFixed(4) + ', ' + Number(centre.longitude).toFixed(4));
      }
      card.appendChild(grid);

      const actions = document.createElement('div');
      actions.className = 'centre-actions';
      const details = document.createElement('button');
      details.className = 'action-btn';
      details.textContent = expanded.has(centre.id) ? 'Hide details' : 'View details';
      details.addEventListener('click', () => {
        if (expanded.has(centre.id)) expanded.delete(centre.id); else expanded.add(centre.id);
        render();
      });
      const map = document.createElement('a');
      map.className = 'action-btn';
      map.textContent = 'Directions';
      map.style.textDecoration = 'none';
      map.target = '_blank';
      map.rel = 'noopener noreferrer';
      map.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(centre.latitude + ',' + centre.longitude);
      const book = document.createElement('button');
      book.className = 'action-btn primary';
      book.textContent = 'Book a slot';
      book.addEventListener('click', () => {
        const farmer = KQ.getFarmer();
        if (farmer) {
          try { localStorage.setItem('Kisan Queue_booking_preferences', JSON.stringify({ farmer_id: farmer.id, mandi_id: centre.id })); } catch (e) { /* ignore */ }
        }
        location.href = 'page03-slot-booking.html';
      });
      actions.appendChild(details);
      actions.appendChild(map);
      actions.appendChild(book);
      card.appendChild(actions);
      list.appendChild(card);
    });

    const none = centres.length > 0 && filtered.length === 0;
    $('emptyState').classList.toggle('show', none);
    list.classList.toggle('hidden', none);
    if (!centres.length && !$('finderMessage').textContent) {
      $('emptyState').classList.add('show');
    }
  }

  $('searchInput').addEventListener('input', render);

  $('locateBtn').addEventListener('click', async () => {
    const button = $('locateBtn');
    button.disabled = true;
    setMessage('Finding your location…');
    try {
      const location = await KQ.getLocation();
      usingLocation = true;
      await loadCentres(location);
    } catch (error) {
      usingLocation = false;
      $('deniedTitle').textContent = 'Location not available';
      $('deniedText').textContent = (error.message || 'Location is not available.') + ' You can still search by village, district or centre name.';
      $('deniedState').classList.add('show');
      setMessage('');
    } finally {
      button.disabled = false;
    }
  });

  function clearAll() {
    $('searchInput').value = '';
    cropFilter = 'all';
    document.querySelectorAll('.filter-chip').forEach((c) => c.classList.toggle('active', c.dataset.filter === 'all'));
    render();
  }
  $('clearFiltersBtn').addEventListener('click', clearAll);
  $('searchInsteadBtn').addEventListener('click', () => { $('deniedState').classList.remove('show'); $('searchInput').focus(); });

  header();
  loadCrops();
  loadCentres(null);
})();
</script>

<script data-component="navigation-inline-js">
(function () {
  'use strict';

  const pages = [
    { n:'01', label:'Landing / Home', file:'page01-landing.html', group:'Farmer portal' },
    { n:'02', label:'Farmer registration', file:'page02-farmer-registration.html', group:'Farmer portal' },
    { n:'03', label:'Slot booking', file:'page03-slot-booking.html', group:'Farmer portal' },
    { n:'04', label:'Booking token', file:'page04-booking-token.html', group:'Farmer portal' },
    { n:'05', label:'Procurement status', file:'page05-procurement-status.html', group:'Farmer portal' },
    { n:'06', label:'Farmer dashboard', file:'page06-farmer-dashboard.html', group:'Farmer portal' },
    { n:'07', label:'Centre finder', file:'page07-centre-finder.html', group:'Farmer portal' },
    { n:'08', label:'Live queue', file:'page08-live-queue.html', group:'Farmer portal' },
    { n:'09', label:'Notifications', file:'page09-notifications.html', group:'Farmer portal' },
    { n:'10', label:'Alerts', file:'page10-alerts.html', group:'Farmer portal' },
    { n:'11', label:'Staff login', file:'page11-staff-login.html', group:'Operations & staff' },
    { n:'12', label:'Operations dashboard', file:'page12-operations-dashboard.html', group:'Operations & staff' },
    { n:'13', label:'Queue console', file:'page13-queue-console.html', group:'Operations & staff' },
    { n:'14', label:'Status management', file:'page14-status-management.html', group:'Operations & staff' },
    { n:'15', label:'Reports & analytics', file:'page15-reports-analytics.html', group:'Operations & staff' },
    { n:'16', label:'Settings', file:'page16-settings.html', group:'Operations & staff' }
  ];

  const currentFile = location.pathname.split(/[\\/]/).pop() || 'page01-landing.html';

  function logoHTML(extraClass) {
    return '<a class="kq-brand-wrap" href="page01-landing.html" aria-label="Farmer Queue home">' +
      '<img class="kq-brand-logo ' + (extraClass || '') + '" src="farmer-queue.png" alt="Farmer Queue">' +
      '</a>';
  }

  function addNavigation() {
    document.body.classList.add('kq-enhanced');

    const menu = document.createElement('button');
    menu.className = 'kq-menu-btn';
    menu.type = 'button';
    menu.setAttribute('aria-label', 'Open navigation menu');
    menu.setAttribute('aria-expanded', 'false');
    menu.innerHTML = '<span class="kq-menu-icon"><span></span><span></span><span></span></span>';
    document.body.appendChild(menu);

    const backdrop = document.createElement('div');
    backdrop.className = 'kq-drawer-backdrop';
    document.body.appendChild(backdrop);

    const drawer = document.createElement('aside');
    drawer.className = 'kq-drawer';
    drawer.setAttribute('aria-label', 'Main navigation');

    const groups = ['Farmer portal', 'Operations & staff'];
    let nav = '';
    groups.forEach(group => {
      nav += '<section class="kq-nav-group"><div class="kq-nav-label">' + group + '</div>';
      pages.filter(p => p.group === group).forEach(p => {
        const active = p.file === currentFile;
        nav += '<a class="kq-nav-link' + (active ? ' active' : '') + '" href="' + p.file + '"' + (active ? ' aria-current="page"' : '') + '>' +
          '<span>' + p.label + '</span></a>';
      });
      nav += '</section>';
    });

    drawer.innerHTML =
      '<div class="kq-drawer-head">' + logoHTML('') + '</div>' +
      '<div class="kq-nav-scroll">' + nav + '</div>' +
      '';
    document.body.appendChild(drawer);

    function setOpen(open) {
      drawer.classList.toggle('is-open', open);
      backdrop.classList.toggle('is-open', open);
      menu.classList.toggle('is-open', open);
      menu.setAttribute('aria-expanded', String(open));
      menu.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
    }
    menu.addEventListener('click', () => setOpen(!drawer.classList.contains('is-open')));
    backdrop.addEventListener('click', () => setOpen(false));
    drawer.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
  }

  function applyBranding() {
    const brands = document.querySelectorAll('header .brand, .topbar .brand');
    brands.forEach(el => {
      el.innerHTML = logoHTML('');
    });

    // Every screen gets a persistent, clickable logo. Existing page headers
    // are upgraded in-place; the login screen receives a matching brand.
    if (currentFile === 'page11-staff-login.html' && !document.querySelector('.kq-login-brand')) {
      const loginBrand = document.createElement('div');
      loginBrand.className = 'kq-login-brand';
      loginBrand.innerHTML = '<a href="page01-landing.html" aria-label="Farmer Queue home"><img src="farmer-queue.png" alt="Farmer Queue"></a>';
      document.body.appendChild(loginBrand);
    }
  }

  function wireCoreLinks() {
    const map = {
      startBookingBtn: 'page03-slot-booking.html',
      checkStatusBtn: 'page05-procurement-status.html',
      searchCentreBtn: 'page07-centre-finder.html',
      viewTokenBtn: 'page04-booking-token.html',
      viewTokenFromDashboard: 'page04-booking-token.html',
      doneBtn: 'page01-landing.html',
      bookFromEmpty: 'page03-slot-booking.html',
      rebookFromCancelled: 'page03-slot-booking.html',
      rebookFromExpired: 'page03-slot-booking.html'
    };
    Object.keys(map).forEach(id => {
      let el = document.getElementById(id);
      if (!el || el.dataset.kqWired) return;
      // Replace only these navigation CTAs so prototype alert/demo handlers do not
      // fire before the user is taken to the connected screen.
      const clean = el.cloneNode(true);
      el.replaceWith(clean);
      el = clean;
      el.dataset.kqWired = '1';
      el.addEventListener('click', () => { location.href = map[id]; });
    });

    document.querySelectorAll('.back-link').forEach(a => {
      a.href = 'page01-landing.html';
      a.removeAttribute('onclick');
    });

    const staffLogin = document.querySelector('.login-link');
    if (staffLogin) {
      staffLogin.href = 'page11-staff-login.html';
      staffLogin.removeAttribute('onclick');
    }
  }

  function init() {
    addNavigation();
    applyBranding();
    wireCoreLinks();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
