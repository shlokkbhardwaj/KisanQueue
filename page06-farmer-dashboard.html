<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<style>
  :root {
    --green-900: #1E231E;
    --green-700: #2D4A2B;
    --green-500: #4C6E48;
    --green-100: #DCE6D6;
    --sage-bg: #EDF1E7;
    --gold: #C9962C;
    --gold-dark: #9C7420;
    --gold-bg: #FBF1DD;
    --white: #FFFFFF;
    --ink: #1E231E;
    --ink-soft: #5A6156;
    --border: #D6DCCE;
    --danger: #B23A2E;
    --danger-bg: #FBEAE7;
    --success: #2D6A3E;
    --success-bg: #E2F1E4;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--sage-bg);
    color: var(--ink);
    min-height: 100vh;
  }

  header {
    color: var(--white);
    padding: 0 2rem;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; color: var(--green-100); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .farmer-badge { display: flex; align-items: center; gap: 8px; }
  .farmer-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--gold); color: var(--green-900);
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .farmer-name { font-size: 13.5px; font-weight: 500; }
  .farmer-village { font-size: 11.5px; color: rgba(255,255,255,0.65); }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 1.75rem 1.25rem 4rem;
  }

  .greeting { margin-bottom: 1.4rem; }
  .greeting-title { font-family: 'Fraunces', serif; font-size: 1.55rem; font-weight: 600; }
  .greeting-sub { font-size: 13.5px; color: var(--ink-soft); margin-top: 3px; }

  .next-action {
    background: var(--green-700);
    color: var(--white);
    border-radius: var(--radius);
    padding: 1.3rem 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .next-action-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--green-100);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .next-action-text {
    font-family: 'Fraunces', serif;
    font-size: 1.2rem;
    font-weight: 500;
    line-height: 1.35;
  }
  .next-action-btn {
    background: var(--gold);
    color: var(--green-900);
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 20px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
  }
  .next-action-btn:hover { background: #DBA843; }

  .grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 14px;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.2rem 1.3rem;
  }
  .card-title {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 10px;
  }

  .col-7 { grid-column: span 7; }
  .col-5 { grid-column: span 5; }
  .col-4 { grid-column: span 4; }
  .col-8 { grid-column: span 8; }
  .col-12 { grid-column: span 12; }

  .booking-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .booking-centre { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 600; color: var(--green-900); }
  .booking-meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; }
  .token-chip {
    background: var(--gold-bg);
    color: var(--gold-dark);
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 6px 14px;
    border-radius: 8px;
  }
  .booking-details { display: flex; gap: 22px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); }
  .booking-details strong { color: var(--ink); display: block; font-size: 13.5px; margin-top: 2px; }

  .queue-position { text-align: center; padding: 0.6rem 0; }
  .queue-number { font-family: 'Fraunces', serif; font-size: 2.6rem; font-weight: 700; color: var(--green-700); line-height: 1; }
  .queue-label { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .queue-wait { font-size: 12.5px; color: var(--gold-dark); font-weight: 600; margin-top: 8px; }

  .status-track { display: flex; align-items: center; margin-top: 6px; }
  .status-step { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
  .status-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--border); z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--white); }
  .status-step.done .status-dot { background: var(--green-700); }
  .status-step.current .status-dot { background: var(--gold); }
  .status-line { position: absolute; top: 9px; left: -50%; width: 100%; height: 2px; background: var(--border); z-index: 0; }
  .status-step:first-child .status-line { display: none; }
  .status-step.done .status-line { background: var(--green-700); }
  .status-label { font-size: 9.5px; color: var(--ink-soft); margin-top: 6px; text-align: center; max-width: 62px; }
  .status-step.done .status-label, .status-step.current .status-label { color: var(--green-900); font-weight: 500; }

  .payment-amount { font-family: 'Fraunces', serif; font-size: 1.7rem; font-weight: 600; margin-bottom: 4px; }
  .payment-pill {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .payment-pill.pending { background: var(--gold-bg); color: var(--gold-dark); }
  .payment-pill.paid { background: var(--success-bg); color: var(--success); }

  .quick-actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  .quick-btn {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 0.5rem;
    text-align: center;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .quick-btn:hover { border-color: var(--green-500); }
  .quick-icon { font-size: 20px; display: block; margin-bottom: 6px; }
  .quick-label { font-size: 12px; font-weight: 500; color: var(--ink); }

  .activity-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-500); margin-top: 5px; flex-shrink: 0; }
  .activity-text { font-size: 13px; color: var(--ink); }
  .activity-time { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  @media (max-width: 860px) {
    .col-7, .col-5, .col-4, .col-8 { grid-column: span 12; }
    .quick-actions { grid-template-columns: repeat(2, 1fr); }
    header { padding: 0 1.25rem; }
  }
</style>

<script src="kq-app.js"></script>
<script>
(function () {
  'use strict';

  /*
   * Farmer dashboard - real data only.
   *   GET /api/bookings/mine            bookings + their tokens
   *   GET /api/queue/status?bookingId   live position for the current booking
   *   GET /api/payments/farmer/:id      payment RECORDS (this app does not process payments)
   * Each card loads independently, so one failure does not blank the whole page.
   */

  if (!KQ.requireLogin()) return;

  const $ = (id) => document.getElementById(id);
  const farmer = KQ.getFarmer();
  const STAGES = ['Booked', 'Checked-in', 'Waiting', 'Quality check', 'Weighing', 'Complete', 'Payment'];
  const STAGE_OF = { BOOKED: 0, CHECKED_IN: 1, WAITING: 2, QUALITY_CHECK: 3, WEIGHING: 4, ACCEPTED: 5, COMPLETED: 5 };
  const ACTIVE_TOKEN = new Set(['WAITING', 'CALLED', 'SERVING', 'HOLD']);

  let currentBooking = null;

  function text(el, value) { el.textContent = value; }

  function dateTime(iso) {
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  }

  function arriveBy(slotStart) {
    const m = /^(\d{1,2}):(\d{2})/.exec(String(slotStart || ''));
    if (!m) return '';
    const t = Math.max(0, Number(m[1]) * 60 + Number(m[2]) - 10);
    return KQ.fmt.time(String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'));
  }

  function showError(message) {
    $('dashErrorText').textContent = message;
    $('dashError').style.display = message ? 'block' : 'none';
  }

  /* -------------------------------------------------------- status track */

  function renderTrack(booking, paymentDone) {
    const track = $('statusTrack');
    track.innerHTML = '';
    let current = -1;
    let allDone = false;
    if (booking && booking.status !== 'CANCELLED') {
      current = STAGE_OF[booking.status] ?? 0;
      if (booking.status === 'COMPLETED') current = 6;
      if (booking.status === 'COMPLETED' && paymentDone) allDone = true;
    }
    STAGES.forEach((label, i) => {
      const done = allDone || (current >= 0 && i < current);
      const step = document.createElement('div');
      step.className = 'status-step' + (done ? ' done' : (!allDone && i === current) ? ' current' : '');
      const dot = document.createElement('div');
      dot.className = 'status-dot';
      dot.textContent = done ? '✓' : '';
      const line = document.createElement('div');
      line.className = 'status-line';
      const lbl = document.createElement('div');
      lbl.className = 'status-label';
      lbl.textContent = label;
      step.appendChild(line);
      step.appendChild(dot);
      step.appendChild(lbl);
      track.appendChild(step);
    });
  }

  /* ------------------------------------------------------------- booking */

  function renderBooking(booking) {
    const body = $('bookingBody');
    body.innerHTML = '';

    if (!booking) {
      text($('bookingTitle'), 'Your booking');
      const empty = document.createElement('div');
      empty.className = 'booking-meta';
      empty.textContent = 'You have no booking yet. Book a slot to get your token.';
      body.appendChild(empty);
      text($('nextActionText'), 'You have no booking yet — book a procurement slot.');
      $('viewTokenBtn').textContent = 'Book a slot';
      $('viewTokenBtn').onclick = () => { location.href = 'page03-slot-booking.html'; };
      return;
    }

    const centre = booking.mandis || {};
    const crop = booking.crops || {};
    const token = booking.token;
    const date = String(booking.booking_date).slice(0, 10);
    text($('bookingTitle'), date === KQ.fmt.todayISO() ? "Today's booking" : (date > KQ.fmt.todayISO() ? 'Upcoming booking' : 'Latest booking'));

    const row = document.createElement('div');
    row.className = 'booking-row';
    const left = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'booking-centre';
    name.textContent = centre.name || 'Procurement centre';
    const meta = document.createElement('div');
    meta.className = 'booking-meta';
    meta.textContent = 'Slot ' + KQ.fmt.time(booking.slot_start) + ' – ' + KQ.fmt.time(booking.slot_end) + ' · ' + KQ.fmt.date(booking.booking_date);
    left.appendChild(name);
    left.appendChild(meta);
    if (centre.address) {
      const addr = document.createElement('div');
      addr.className = 'booking-meta';
      addr.textContent = centre.address;
      left.appendChild(addr);
    }
    const chip = document.createElement('div');
    chip.className = 'token-chip';
    chip.textContent = token ? KQ.fmt.token(token.token_number) : 'No token';
    row.appendChild(left);
    row.appendChild(chip);

    const details = document.createElement('div');
    details.className = 'booking-details';
    [['Produce', (crop.name || '—') + ', ' + KQ.fmt.quantity(booking.quantity_quintals)],
     ['Booked on', dateTime(booking.created_at)],
     ['Status', KQ.fmt.statusLabel(booking.status)]].forEach(([label, value]) => {
      const cell = document.createElement('div');
      cell.appendChild(document.createTextNode(label));
      const strong = document.createElement('strong');
      strong.textContent = value;
      cell.appendChild(strong);
      details.appendChild(cell);
    });

    body.appendChild(row);
    body.appendChild(details);

    // Next step banner
    const by = arriveBy(booking.slot_start);
    let message;
    if (booking.status === 'CANCELLED') message = 'This booking was cancelled — book a new slot when you are ready.';
    else if (booking.status === 'COMPLETED') message = 'Your produce at ' + (centre.name || 'the centre') + ' has been processed.';
    else if (!token) message = 'Your booking is saved but has no queue token yet — open your token page to generate it.';
    else message = 'Your slot: ' + KQ.fmt.date(booking.booking_date, { weekday: 'short', day: 'numeric', month: 'short' }) + ', ' +
      KQ.fmt.time(booking.slot_start) + ' at ' + (centre.name || 'the centre') + (by ? ' — arrive by ' + by : '');
    text($('nextActionText'), message);
    $('viewTokenBtn').textContent = 'View my token';
    $('viewTokenBtn').onclick = () => { location.href = 'page04-booking-token.html?bookingId=' + booking.id; };
  }

  /* --------------------------------------------------------------- queue */

  async function loadQueue(booking) {
    const number = $('queueNumber');
    if (!booking || !booking.token || !ACTIVE_TOKEN.has(booking.token.status) || booking.status === 'CANCELLED') {
      text(number, '—');
      text($('queueLabel'), booking && booking.token
        ? 'Your token is ' + KQ.fmt.statusLabel(booking.token.status).toLowerCase()
        : 'Your position appears here once you have an active token.');
      text($('queueWait'), '');
      return;
    }
    text($('queueLabel'), 'Loading…');
    try {
      const status = await KQ.api('/queue/status?bookingId=' + booking.id);
      const mine = status.mine;
      if (!mine || mine.tokensAhead === null || mine.tokensAhead === undefined) {
        text(number, '—');
        text($('queueLabel'), 'Position not available');
        return;
      }
      text(number, mine.tokensAhead);
      text($('queueLabel'), mine.tokensAhead === 1 ? 'token ahead of you' : 'tokens ahead of you');
      text($('queueWait'), mine.estimatedWaitMinutes === 0
        ? 'It is your turn — please go to the counter'
        : mine.estimatedWaitMinutes !== null && mine.estimatedWaitMinutes !== undefined
          ? 'Estimated wait: about ' + KQ.fmt.minutes(mine.estimatedWaitMinutes)
          : 'Estimated wait: not available yet');
      if (booking.booking_date && String(booking.booking_date).slice(0, 10) === KQ.fmt.todayISO()) {
        const centreName = (booking.mandis && booking.mandis.name) || 'the centre';
        const by = arriveBy(booking.slot_start);
        text($('nextActionText'), (mine.tokensAhead === 0 ? 'You are next at ' : mine.tokensAhead + (mine.tokensAhead === 1 ? ' token is' : ' tokens are') + ' ahead of you at ') +
          centreName + (by && mine.tokensAhead > 0 ? ' — arrive by ' + by : ''));
      }
    } catch (error) {
      if (error.kind === 'auth') return;
      text(number, '—');
      text($('queueLabel'), KQ.describeError(error, 'load the queue position'));
    }
  }

  /* ------------------------------------------------------------ payments */

  function renderPayments(payments, booking) {
    const list = payments || [];
    const forBooking = booking ? list.find((p) => Number(p.booking_id) === Number(booking.id)) : null;
    const shown = forBooking || null;
    const pill = $('payPill');
    pill.className = 'payment-pill pending';

    if (!shown) {
      text($('payAmount'), '—');
      text(pill, list.length ? 'No payment for this booking yet' : 'No payment records yet');
      text($('payNote'), 'Payment records appear here after the procurement centre processes your produce. ' +
        'This app only displays them — it does not make or collect payments.');
    } else {
      text($('payAmount'), KQ.fmt.money(shown.amount));
      text(pill, KQ.fmt.statusLabel(shown.status));
      if (shown.status === 'CREDITED') pill.className = 'payment-pill paid';
      text($('payNote'), (shown.transaction_reference ? 'Reference ' + shown.transaction_reference + ' · ' : '') +
        (shown.payment_date ? dateTime(shown.payment_date) : dateTime(shown.created_at)));
    }

    const history = $('payHistory');
    history.innerHTML = '';
    list.filter((p) => p !== shown).slice(0, 3).forEach((p) => {
      const item = document.createElement('div');
      item.className = 'activity-time';
      item.textContent = KQ.fmt.money(p.amount) + ' · ' + KQ.fmt.statusLabel(p.status) + ' · ' + dateTime(p.payment_date || p.created_at);
      history.appendChild(item);
    });
  }

  /* ------------------------------------------------------------ activity */

  function renderActivity(bookings, payments) {
    const events = [];
    (bookings || []).forEach((b) => {
      const centre = (b.mandis && b.mandis.name) || 'the centre';
      events.push({ at: b.created_at, text: 'Slot booked at ' + centre + ' for ' + KQ.fmt.date(b.booking_date, { day: 'numeric', month: 'short' }) + ', ' + KQ.fmt.time(b.slot_start) });
      if (b.token) {
        events.push({ at: b.token.created_at, text: 'Token ' + KQ.fmt.token(b.token.token_number) + ' issued' });
        if (b.token.called_at) events.push({ at: b.token.called_at, text: 'Token ' + KQ.fmt.token(b.token.token_number) + ' was called' });
        if (b.token.completed_at) events.push({ at: b.token.completed_at, text: 'Token ' + KQ.fmt.token(b.token.token_number) + ' completed' });
      }
      if (b.status === 'CANCELLED') events.push({ at: b.created_at, text: 'Booking at ' + centre + ' was cancelled', order: 1 });
    });
    (payments || []).forEach((p) => events.push({ at: p.payment_date || p.created_at, text: 'Payment of ' + KQ.fmt.money(p.amount) + ' — ' + KQ.fmt.statusLabel(p.status) }));

    events.sort((a, b) => new Date(b.at) - new Date(a.at));
    const list = $('activityList');
    list.innerHTML = '';
    if (!events.length) {
      const none = document.createElement('div');
      none.className = 'activity-time';
      none.textContent = 'No activity yet.';
      list.appendChild(none);
      return;
    }
    events.slice(0, 6).forEach((e) => {
      const item = document.createElement('div');
      item.className = 'activity-item';
      const dot = document.createElement('div');
      dot.className = 'activity-dot';
      const box = document.createElement('div');
      const t = document.createElement('div');
      t.className = 'activity-text';
      t.textContent = e.text;
      const time = document.createElement('div');
      time.className = 'activity-time';
      time.textContent = dateTime(e.at);
      box.appendChild(t);
      box.appendChild(time);
      item.appendChild(dot);
      item.appendChild(box);
      list.appendChild(item);
    });
  }

  /* ---------------------------------------------------------------- load */

  async function load() {
    showError('');
    text($('greetingTitle'), 'Namaste, ' + String(farmer.full_name || '').split(/\s+/)[0]);

    let bookings = [];
    try {
      const result = await KQ.api('/bookings/mine');
      bookings = result.data || [];
    } catch (error) {
      if (error.kind === 'auth') return;
      console.error('Dashboard error:', error);
      showError(KQ.describeError(error, 'load your bookings'));
      text($('nextActionText'), 'Your bookings could not be loaded.');
      text($('queueLabel'), '—');
      renderTrack(null, false);
      return;
    }

    currentBooking = KQ.pickCurrentBooking(bookings);
    renderBooking(currentBooking);
    loadQueue(currentBooking);

    let payments = [];
    try {
      payments = (await KQ.api('/payments/farmer/' + farmer.id)).data || [];
      renderPayments(payments, currentBooking);
    } catch (error) {
      if (error.kind === 'auth') return;
      text($('payAmount'), '—');
      text($('payPill'), 'Unavailable');
      text($('payNote'), KQ.describeError(error, 'load payment records'));
    }

    const paid = currentBooking && payments.some((p) => Number(p.booking_id) === Number(currentBooking.id) && p.status === 'CREDITED');
    renderTrack(currentBooking, paid);
    renderActivity(bookings, payments);
  }

  const routes = { booking: 'page03-slot-booking.html', help: 'page07-centre-finder.html' };
  function go(where) {
    if (where === 'token') location.href = 'page04-booking-token.html' + (currentBooking ? '?bookingId=' + currentBooking.id : '');
    else if (where === 'status') location.href = 'page08-live-queue.html' + (currentBooking ? '?bookingId=' + currentBooking.id : '');
    else if (routes[where]) location.href = routes[where];
  }
  document.querySelectorAll('[data-go]').forEach((btn) => {
    btn.addEventListener('click', () => go(btn.dataset.go));
    btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(btn.dataset.go); } });
  });
  $('dashRetry').addEventListener('click', load);

  KQ.mountAuthUI();
  load();
  setInterval(() => { if (!document.hidden && currentBooking) loadQueue(currentBooking); }, 30000);
})();
</script>

    const groups = ['Farmer portal', 'Operations & staff'];
    let nav = '';
    groups.forEach(group => {
      nav += '<section class="kq-nav-group"><div class="kq-nav-label">' + group + '</div>';
      pages.filter(p => p.group === group).forEach(p => {
        const active = p.file === currentFile;
        nav += '<a class="kq-nav-link' + (active ? ' active' : '') + '" href="' + p.file + '"' + (active ? ' aria-current="page"' : '') + '>' +
          '<span>' + p.label + '</span></a>';
      });
      nav += '</section>';
    });

    drawer.innerHTML =
      '<div class="kq-drawer-head">' + logoHTML('') + '</div>' +
      '<div class="kq-nav-scroll">' + nav + '</div>' +
      '';
    document.body.appendChild(drawer);

    function setOpen(open) {
      drawer.classList.toggle('is-open', open);
      backdrop.classList.toggle('is-open', open);
      menu.classList.toggle('is-open', open);
      menu.setAttribute('aria-expanded', String(open));
      menu.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
    }
    menu.addEventListener('click', () => setOpen(!drawer.classList.contains('is-open')));
    backdrop.addEventListener('click', () => setOpen(false));
    drawer.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
  }

  function applyBranding() {
    const brands = document.querySelectorAll('header .brand, .topbar .brand');
    brands.forEach(el => {
      el.innerHTML = logoHTML('');
    });

    // Every screen gets a persistent, clickable logo. Existing page headers
    // are upgraded in-place; the login screen receives a matching brand.
    if (currentFile === 'page11-staff-login.html' && !document.querySelector('.kq-login-brand')) {
      const loginBrand = document.createElement('div');
      loginBrand.className = 'kq-login-brand';
      loginBrand.innerHTML = '<a href="page01-landing.html" aria-label="Farmer Queue home"><img src="farmer-queue.png" alt="Farmer Queue"></a>';
      document.body.appendChild(loginBrand);
    }
  }

  function wireCoreLinks() {
    const map = {
      startBookingBtn: 'page03-slot-booking.html',
      checkStatusBtn: 'page05-procurement-status.html',
      searchCentreBtn: 'page07-centre-finder.html',
      viewTokenBtn: 'page04-booking-token.html',
      viewTokenFromDashboard: 'page04-booking-token.html',
      doneBtn: 'page01-landing.html',
      bookFromEmpty: 'page03-slot-booking.html',
      rebookFromCancelled: 'page03-slot-booking.html',
      rebookFromExpired: 'page03-slot-booking.html'
    };
    Object.keys(map).forEach(id => {
      let el = document.getElementById(id);
      if (!el || el.dataset.kqWired) return;
      // Replace only these navigation CTAs so prototype alert/demo handlers do not
      // fire before the user is taken to the connected screen.
      const clean = el.cloneNode(true);
      el.replaceWith(clean);
      el = clean;
      el.dataset.kqWired = '1';
      el.addEventListener('click', () => { location.href = map[id]; });
    });

    document.querySelectorAll('.back-link').forEach(a => {
      a.href = 'page01-landing.html';
      a.removeAttribute('onclick');
    });

    const staffLogin = document.querySelector('.login-link');
    if (staffLogin) {
      staffLogin.href = 'page11-staff-login.html';
      staffLogin.removeAttribute('onclick');
    }
  }

  function init() {
    addNavigation();
    applyBranding();
    wireCoreLinks();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
