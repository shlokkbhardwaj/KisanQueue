<style>
  :root {
    --green-900: #1E231E; --green-700: #2D4A2B; --green-500: #4C6E48; --green-100: #DCE6D6;
    --sage-bg: #EDF1E7; --gold: #C9962C; --gold-dark: #9C7420; --gold-bg: #FBF1DD;
    --white: #FFFFFF; --ink: #1E231E; --ink-soft: #5A6156; --border: #D6DCCE;
    --danger: #B23A2E; --danger-bg: #FBEAE7; --success: #2D6A3E; --success-bg: #E2F1E4;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--sage-bg); color: var(--ink); min-height: 100vh; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 2rem; max-width: 620px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-mark { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 700; color: var(--green-900); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .farmer-badge { display: flex; align-items: center; gap: 8px; }
  .farmer-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--gold); color: var(--green-900); font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .farmer-name { font-size: 13.5px; font-weight: 500; }
  .farmer-village { font-size: 11.5px; color: var(--ink-soft); }

  .subnav { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 46px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); max-width: 620px; margin: 0 auto; }
  .subnav .current { color: var(--green-900); font-weight: 500; }

  main { max-width: 620px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  .demo-label {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--gold-bg); color: var(--gold-dark);
    font-size: 11.5px; font-weight: 600;
    padding: 5px 12px; border-radius: 20px;
    margin-bottom: 1rem;
  }
  .demo-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold-dark); }

  .sync-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; }
  .page-title { font-family: 'Fraunces', serif; font-size: 1.45rem; font-weight: 600; }
  .sync-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 1.6s ease infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .queue-hero {
    background: var(--green-700);
    color: var(--white);
    border-radius: var(--radius);
    padding: 2rem 1.5rem;
    text-align: center;
    margin-bottom: 1.3rem;
    position: relative;
    overflow: hidden;
  }
  .queue-hero::before {
    content: "";
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 2px, transparent 2px, transparent 40px);
  }
  .queue-token { font-size: 12.5px; color: var(--green-100); position: relative; z-index: 1; }
  .queue-position-num { font-family: 'Fraunces', serif; font-size: 3.5rem; font-weight: 700; line-height: 1.1; position: relative; z-index: 1; }
  .queue-position-label { font-size: 13px; color: var(--green-100); margin-top: 2px; position: relative; z-index: 1; }
  .queue-wait { font-size: 13.5px; font-weight: 600; color: var(--gold); margin-top: 10px; position: relative; z-index: 1; }

  .progress-track { height: 8px; background: rgba(255,255,255,0.2); border-radius: 6px; margin-top: 1.1rem; overflow: hidden; position: relative; z-index: 1; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 6px; transition: width 0.6s ease; }

  .counters-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1.3rem; margin-bottom: 1.2rem; }
  .card-title { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 10px; }
  .counters-row { display: flex; gap: 10px; }
  .counter-chip { flex: 1; text-align: center; padding: 10px; border-radius: 9px; background: var(--sage-bg); font-size: 12px; }
  .counter-chip.active-serving { background: var(--success-bg); color: var(--success); }
  .counter-chip.offline { background: var(--danger-bg); color: var(--danger); }
  .counter-num { font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.1rem; margin-bottom: 2px; }

  .ahead-list-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem 1.3rem; margin-bottom: 1.2rem; }
  .ahead-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .ahead-row:last-child { border-bottom: none; }
  .ahead-pos { color: var(--ink-soft); }
  .ahead-status { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; }
  .ahead-status.serving { background: var(--success-bg); color: var(--success); }
  .ahead-status.waiting { background: var(--gold-bg); color: var(--gold-dark); }

  .leave-note { font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.6; }

  @media (max-width: 480px) {
    .topbar { padding: 1rem 1.25rem; }
    .subnav { padding: 0 1.25rem; overflow-x: auto; white-space: nowrap; }
    main { padding: 1.25rem 1.1rem 3rem; }
    .queue-position-num { font-size: 2.8rem; }
  }
</style>

<body>
<div class="topbar">
<div class="brand"><a aria-label="Farmer Queue home" href="page01-landing.html"><img alt="Farmer Queue" class="farmer-queue-logo" src="farmer-queue.png"/></a></div>
<div class="header-right">
<div class="farmer-badge">
<div class="farmer-avatar">SY</div>
<div><div class="farmer-name">Suresh Yadav</div><div class="farmer-village">Kheri Village</div></div>
</div>
</div>
</div>
<main>
<div class="sync-row">
<div class="page-title">Live queue</div>
<div class="sync-indicator" aria-live="polite"><span class="sync-dot"></span><span id="syncText">Loading…</span></div>
</div>
<div class="leave-note" id="queueMessage" role="status" style="display:none"></div>
<div class="queue-hero" id="queueHero" style="display:none">
<div class="queue-token" id="heroToken">—</div>
<div class="queue-position-num" id="posNum">—</div>
<div class="queue-position-label" id="posLabel">tokens ahead of you</div>
<div class="queue-wait" id="waitText">—</div>
<div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="queue-position-label" id="progressText" style="margin-top:8px"></div>
</div>
<div class="counters-card" id="centreCard" style="display:none">
<div class="card-title" id="centreTitle">This centre today</div>
<div class="counters-row" id="countersRow"></div>
</div>
<div class="ahead-list-card" id="aheadCard" style="display:none">
<div class="card-title">Ahead of you</div>
<div id="aheadRows"></div>
</div>
<div class="leave-note" id="footNote" style="display:none">This screen refreshes automatically every 15 seconds while you wait. Queue order is by slot time, then token number.</div>
<div style="text-align:center;margin-top:18px">
<a class="btn" id="bookLink" href="page03-slot-booking.html" style="display:none;text-decoration:none">Book a slot</a>
<a class="btn" id="tokenLink" href="page04-booking-token.html" style="display:none;text-decoration:none">Open my token</a>
</div>
</main>
<script src="kq-app.js"></script>
<script>
(function () {
  'use strict';

  /*
   * Page 08 - live queue. Real data only:
   *   GET /api/bookings/mine          -> which booking to follow (or ?bookingId=)
   *   GET /api/queue/status?bookingId -> centre summary + my position
   * Anything the database cannot support (for example the waiting time before any token has been
   * completed) is shown as "not available yet" instead of being estimated.
   */

  if (!KQ.requireLogin()) return;

  const $ = (id) => document.getElementById(id);
  const REFRESH_MS = 15000;
  let bookingId = null;
  let timer = null;
  let lastGood = false;

  function setMessage(text, kind) {
    const box = $('queueMessage');
    box.textContent = text || '';
    box.style.display = text ? 'block' : 'none';
    box.style.color = kind === 'error' ? '#A83232' : '';
  }

  function ordinal(n) {
    const s = ['th', 'st', 'nd', 'rd'];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function setSync(text) { $('syncText').textContent = text; }

  function chip(cls, num, text) {
    const el = document.createElement('div');
    el.className = 'counter-chip ' + cls;
    const n = document.createElement('div');
    n.className = 'counter-num';
    n.textContent = num;
    el.appendChild(n);
    el.appendChild(document.createTextNode(text));
    return el;
  }

  function render(status) {
    const { summary, mine } = status;
    setMessage('');

    if (!mine) {
      $('queueHero').style.display = 'none';
      $('aheadCard').style.display = 'none';
      setMessage('Your booking does not have a queue token yet. Open your token page to generate it.');
      $('tokenLink').style.display = '';
      $('tokenLink').href = 'page04-booking-token.html?bookingId=' + bookingId;
    } else {
      $('tokenLink').style.display = 'none';
      $('queueHero').style.display = 'block';
      $('heroToken').textContent = 'Token ' + KQ.fmt.token(mine.tokenNumber) + ' · ' + summary.mandiName;

      const finished = mine.tokensAhead === null || mine.tokensAhead === undefined;
      if (finished) {
        $('posNum').textContent = '—';
        $('posLabel').textContent = 'Your token is ' + KQ.fmt.statusLabel(mine.tokenStatus).toLowerCase();
        $('waitText').textContent = '';
      } else {
        $('posNum').textContent = mine.tokensAhead;
        $('posLabel').textContent = mine.tokensAhead === 1 ? 'token ahead of you' : 'tokens ahead of you';
        if (mine.estimatedWaitMinutes === 0) {
          $('waitText').textContent = 'It is your turn — please proceed to the counter';
        } else if (mine.estimatedWaitMinutes !== null && mine.estimatedWaitMinutes !== undefined) {
          $('waitText').textContent = 'Estimated wait: about ' + KQ.fmt.minutes(mine.estimatedWaitMinutes) +
            ' (based on ' + summary.avgServiceMinutes + ' min per token so far today)';
        } else {
          $('waitText').textContent = 'Estimated wait: not available yet (needs a few completed tokens today)';
        }
      }

      if (summary.totalTokens > 0) {
        $('progressTrack').style.display = '';
        $('progressFill').style.width = Math.round((summary.completedCount / summary.totalTokens) * 100) + '%';
        $('progressText').textContent = summary.completedCount + ' of ' + summary.totalTokens + ' tokens completed at this centre today';
      } else {
        $('progressTrack').style.display = 'none';
        $('progressText').textContent = '';
      }

      // Tokens ahead of me
      const rows = $('aheadRows');
      rows.innerHTML = '';
      (mine.aheadTokens || []).forEach((t, i) => {
        const row = document.createElement('div');
        row.className = 'ahead-row';
        const a = document.createElement('span');
        a.textContent = KQ.fmt.token(t.token_number);
        const b = document.createElement('span');
        if (t.status === 'SERVING' || t.status === 'CALLED') {
          b.className = 'ahead-status serving';
          b.textContent = t.status === 'CALLED' ? 'Called' : 'Being served';
        } else {
          b.className = 'ahead-pos';
          b.textContent = ordinal(i + 1) + ' in line';
        }
        row.appendChild(a);
        row.appendChild(b);
        rows.appendChild(row);
      });
      const me = document.createElement('div');
      me.className = 'ahead-row';
      const meA = document.createElement('span');
      meA.textContent = KQ.fmt.token(mine.tokenNumber) + ' (you)';
      const meB = document.createElement('span');
      meB.className = 'ahead-status waiting';
      meB.textContent = finished ? KQ.fmt.statusLabel(mine.tokenStatus) : ordinal((mine.aheadTokens || []).length + 1) + ' in line';
      me.appendChild(meA);
      me.appendChild(meB);
      rows.appendChild(me);
      $('aheadCard').style.display = 'block';
    }

    // Centre card: current token + counters (only what tokens actually say)
    $('centreTitle').textContent = summary.mandiName + ' — today';
    const row = $('countersRow');
    row.innerHTML = '';
    if (summary.counters && summary.counters.length) {
      summary.counters.forEach((c) => row.appendChild(chip('active-serving', c.counter, 'Serving ' + KQ.fmt.token(c.token_number))));
    } else if (summary.currentToken !== null && summary.currentToken !== undefined) {
      row.appendChild(chip('active-serving', '●', 'Now serving ' + KQ.fmt.token(summary.currentToken)));
    } else {
      const none = document.createElement('div');
      none.className = 'leave-note';
      none.style.margin = '0';
      none.textContent = 'No token has been called at this centre yet.';
      row.appendChild(none);
    }
    const waiting = document.createElement('div');
    waiting.className = 'counter-chip offline';
    const wn = document.createElement('div');
    wn.className = 'counter-num';
    wn.textContent = summary.waitingCount;
    waiting.appendChild(wn);
    waiting.appendChild(document.createTextNode('Waiting'));
    row.appendChild(waiting);
    $('centreCard').style.display = 'block';
    $('footNote').style.display = 'block';
  }

  async function refresh() {
    if (!bookingId) return;
    try {
      const status = await KQ.api('/queue/status?bookingId=' + bookingId);
      render(status);
      lastGood = true;
      setSync('Updated ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
    } catch (error) {
      console.error('Queue status error:', error);
      if (error.kind === 'auth') return;
      setSync('Not connected');
      setMessage((lastGood ? 'Could not refresh the queue. Showing the last update; retrying…  ' : '') + KQ.describeError(error, 'load the queue'), 'error');
    }
  }

  async function start() {
    KQ.mountAuthUI();
    try {
      const fromUrl = new URLSearchParams(location.search).get('bookingId');
      if (fromUrl && /^\d+$/.test(fromUrl)) {
        bookingId = Number(fromUrl);
      } else {
        const mine = await KQ.api('/bookings/mine');
        const booking = KQ.pickCurrentBooking(mine.data);
        bookingId = booking ? Number(booking.id) : null;
      }
    } catch (error) {
      if (error.kind === 'auth') return;
      setSync('Not connected');
      setMessage(KQ.describeError(error, 'load your booking'), 'error');
      return;
    }

    if (!bookingId) {
      setSync('No active booking');
      setMessage('You do not have an active booking, so there is no queue position to show. Book a slot to get a token.');
      $('bookLink').style.display = '';
      return;
    }

    await refresh();
    timer = setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  }

  start();
})();
</script>

<script data-component="navigation-inline-js">
(function () {
  'use strict';

  const pages = [
    { n:'01', label:'Landing / Home', file:'page01-landing.html', group:'Farmer portal' },
    { n:'02', label:'Farmer registration', file:'page02-farmer-registration.html', group:'Farmer portal' },
    { n:'03', label:'Slot booking', file:'page03-slot-booking.html', group:'Farmer portal' },
    { n:'04', label:'Booking token', file:'page04-booking-token.html', group:'Farmer portal' },
    { n:'05', label:'Procurement status', file:'page05-procurement-status.html', group:'Farmer portal' },
    { n:'06', label:'Farmer dashboard', file:'page06-farmer-dashboard.html', group:'Farmer portal' },
    { n:'07', label:'Centre finder', file:'page07-centre-finder.html', group:'Farmer portal' },
    { n:'08', label:'Live queue', file:'page08-live-queue.html', group:'Farmer portal' },
    { n:'09', label:'Notifications', file:'page09-notifications.html', group:'Farmer portal' },
    { n:'10', label:'Alerts', file:'page10-alerts.html', group:'Farmer portal' },
    { n:'11', label:'Staff login', file:'page11-staff-login.html', group:'Operations & staff' },
    { n:'12', label:'Operations dashboard', file:'page12-operations-dashboard.html', group:'Operations & staff' },
    { n:'13', label:'Queue console', file:'page13-queue-console.html', group:'Operations & staff' },
    { n:'14', label:'Status management', file:'page14-status-management.html', group:'Operations & staff' },
    { n:'15', label:'Reports & analytics', file:'page15-reports-analytics.html', group:'Operations & staff' },
    { n:'16', label:'Settings', file:'page16-settings.html', group:'Operations & staff' }
  ];

  const currentFile = location.pathname.split(/[\\/]/).pop() || 'page01-landing.html';

  function logoHTML(extraClass) {
    return '<a class="kq-brand-wrap" href="page01-landing.html" aria-label="Farmer Queue home">' +
      '<img class="kq-brand-logo ' + (extraClass || '') + '" src="farmer-queue.png" alt="Farmer Queue">' +
      '</a>';
  }

  function addNavigation() {
    document.body.classList.add('kq-enhanced');

    const menu = document.createElement('button');
    menu.className = 'kq-menu-btn';
    menu.type = 'button';
    menu.setAttribute('aria-label', 'Open navigation menu');
    menu.setAttribute('aria-expanded', 'false');
    menu.innerHTML = '<span class="kq-menu-icon"><span></span><span></span><span></span></span>';
    document.body.appendChild(menu);

    const backdrop = document.createElement('div');
    backdrop.className = 'kq-drawer-backdrop';
    document.body.appendChild(backdrop);

    const drawer = document.createElement('aside');
    drawer.className = 'kq-drawer';
    drawer.setAttribute('aria-label', 'Main navigation');

    const groups = ['Farmer portal', 'Operations & staff'];
    let nav = '';
    groups.forEach(group => {
      nav += '<section class="kq-nav-group"><div class="kq-nav-label">' + group + '</div>';
      pages.filter(p => p.group === group).forEach(p => {
        const active = p.file === currentFile;
        nav += '<a class="kq-nav-link' + (active ? ' active' : '') + '" href="' + p.file + '"' + (active ? ' aria-current="page"' : '') + '>' +
          '<span>' + p.label + '</span></a>';
      });
      nav += '</section>';
    });

    drawer.innerHTML =
      '<div class="kq-drawer-head">' + logoHTML('') + '</div>' +
      '<div class="kq-nav-scroll">' + nav + '</div>' +
      '';
    document.body.appendChild(drawer);

    function setOpen(open) {
      drawer.classList.toggle('is-open', open);
      backdrop.classList.toggle('is-open', open);
      menu.classList.toggle('is-open', open);
      menu.setAttribute('aria-expanded', String(open));
      menu.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
    }
    menu.addEventListener('click', () => setOpen(!drawer.classList.contains('is-open')));
    backdrop.addEventListener('click', () => setOpen(false));
    drawer.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
  }

  function applyBranding() {
    const brands = document.querySelectorAll('header .brand, .topbar .brand');
    brands.forEach(el => {
      el.innerHTML = logoHTML('');
    });

    // Every screen gets a persistent, clickable logo. Existing page headers
    // are upgraded in-place; the login screen receives a matching brand.
    if (currentFile === 'page11-staff-login.html' && !document.querySelector('.kq-login-brand')) {
      const loginBrand = document.createElement('div');
      loginBrand.className = 'kq-login-brand';
      loginBrand.innerHTML = '<a href="page01-landing.html" aria-label="Farmer Queue home"><img src="farmer-queue.png" alt="Farmer Queue"></a>';
      document.body.appendChild(loginBrand);
    }
  }

  function wireCoreLinks() {
    const map = {
      startBookingBtn: 'page03-slot-booking.html',
      checkStatusBtn: 'page05-procurement-status.html',
      searchCentreBtn: 'page07-centre-finder.html',
      viewTokenBtn: 'page04-booking-token.html',
      viewTokenFromDashboard: 'page04-booking-token.html',
      doneBtn: 'page01-landing.html',
      bookFromEmpty: 'page03-slot-booking.html',
      rebookFromCancelled: 'page03-slot-booking.html',
      rebookFromExpired: 'page03-slot-booking.html'
    };
    Object.keys(map).forEach(id => {
      let el = document.getElementById(id);
      if (!el || el.dataset.kqWired) return;
      // Replace only these navigation CTAs so prototype alert/demo handlers do not
      // fire before the user is taken to the connected screen.
      const clean = el.cloneNode(true);
      el.replaceWith(clean);
      el = clean;
      el.dataset.kqWired = '1';
      el.addEventListener('click', () => { location.href = map[id]; });
    });

    document.querySelectorAll('.back-link').forEach(a => {
      a.href = 'page01-landing.html';
      a.removeAttribute('onclick');
    });

    const staffLogin = document.querySelector('.login-link');
    if (staffLogin) {
      staffLogin.href = 'page11-staff-login.html';
      staffLogin.removeAttribute('onclick');
    }
  }

  function init() {
    addNavigation();
    applyBranding();
    wireCoreLinks();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
