<style>
  :root {
    --green-900: #1E231E; --green-700: #2D4A2B; --green-500: #4C6E48; --green-100: #DCE6D6;

    --white: #FFFFFF; --ink: #1E231E; --ink-soft: #5A6156; --border: #D6DCCE;
    --danger: #B23A2E; --danger-bg: #FBEAE7; --success: #2D6A3E; --success-bg: #E2F1E4;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--sage-bg); color: var(--ink); min-height: 100vh; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 2rem; max-width: 640px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 9px; }
  .brand-mark { font-family: 'Fraunces', serif; font-size: 19px; font-weight: 700; color: var(--green-900); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .farmer-badge { display: flex; align-items: center; gap: 8px; }
  .farmer-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--gold); color: var(--green-900); font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .farmer-name { font-size: 13.5px; font-weight: 500; }
  .farmer-village { font-size: 11.5px; color: var(--ink-soft); }

  .subnav { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 46px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); max-width: 640px; margin: 0 auto; }
  .subnav .current { color: var(--green-900); font-weight: 500; }

  main { max-width: 640px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  .page-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 8px; }
  .page-title { font-family: 'Fraunces', serif; font-size: 1.45rem; font-weight: 600; }
  .mark-read-btn { font-size: 12.5px; font-weight: 500; color: var(--green-700); background: none; border: none; cursor: pointer; }
  .mark-read-btn:hover { text-decoration: underline; }

  .demo-toggle { display: flex; gap: 8px; margin-bottom: 1.2rem; flex-wrap: wrap; }
  .demo-toggle button { font-size: 11.5px; font-family: 'Inter', sans-serif; padding: 6px 11px; border-radius: 7px; border: 1px solid var(--border); background: var(--white); color: var(--ink-soft); cursor: pointer; }
  .demo-toggle button.active { background: var(--green-900); color: var(--white); border-color: var(--green-900); }

  .filter-row { display: flex; gap: 8px; margin-bottom: 1.3rem; flex-wrap: wrap; }
  .filter-chip { font-size: 12px; font-weight: 500; padding: 6px 13px; border-radius: 20px; border: 1px solid var(--border); background: var(--white); color: var(--ink-soft); cursor: pointer; }
  .filter-chip.active { background: var(--green-700); color: var(--white); border-color: var(--green-700); }

  .notif-view.hidden { display: none; }

  .notif-item { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 9px; display: flex; gap: 12px; cursor: pointer; position: relative; }
  .notif-item.unread { border-left: 3px solid var(--green-700); }
  .notif-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--sage-bg); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .notif-content { flex: 1; }
  .notif-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .notif-item:not(.unread) .notif-title { font-weight: 500; color: var(--ink-soft); }
  .notif-desc { font-size: 12.5px; color: var(--ink-soft); margin-top: 3px; line-height: 1.5; }
  .notif-time { font-size: 11px; color: var(--ink-soft); margin-top: 5px; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green-700); position: absolute; top: 14px; right: 14px; }

  .loading-item { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem; margin-bottom: 9px; display: flex; gap: 12px; }
  .skeleton-circle { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(90deg, var(--green-100) 25%, #EEF2E9 37%, var(--green-100) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; flex-shrink: 0; }
  .skeleton-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--green-100) 25%, #EEF2E9 37%, var(--green-100) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; margin-bottom: 8px; }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  .empty-state, .error-state { display: none; text-align: center; padding: 3rem 1rem; background: var(--white); border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty-state.show, .error-state.show { display: block; }
  .empty-icon, .error-icon { font-size: 32px; margin-bottom: 10px; }
  .empty-title, .error-title { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; }
  .empty-sub, .error-sub { font-size: 13.5px; color: var(--ink-soft); margin-bottom: 1rem; }
  .btn { padding: 10px 18px; border-radius: 9px; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; border: none; background: var(--green-700); color: var(--white); }
  .btn:hover { background: var(--green-900); }

  @media (max-width: 480px) {
    .topbar { padding: 1rem 1.25rem; }
    .subnav { padding: 0 1.25rem; overflow-x: auto; white-space: nowrap; }
    main { padding: 1.25rem 1.1rem 3rem; }
  }

<script>
(function () {
  'use strict';

  /* Page 09 - notifications from GET /api/notifications (rows the backend writes when you book / get a token). */

  if (!KQ.requireLogin()) return;

  const $ = (id) => document.getElementById(id);
  const ICONS = { booking: '📅', queue: '⏳', payment: '💰', centre: '📢' };
  let notifications = [];

  function categoryOf(n) {
    const t = String(n.type || '').toUpperCase();
    return t === 'BOOKING' ? 'booking' : t === 'QUEUE' ? 'queue' : t === 'PAYMENT' ? 'payment' : 'centre';
  }

  function when(iso) {
    const d = new Date(iso);
    return isNaN(d.getTime()) ? '' : d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
  }

  function state(name) {
    $('loadedView').classList.toggle('hidden', name !== 'loaded');
    $('loadingView').classList.toggle('hidden', name !== 'loading');
    $('emptyState').classList.toggle('show', name === 'empty');
    $('errorState').classList.toggle('show', name === 'error');
  }

  function render(filter) {
    const view = $('loadedView');
    view.innerHTML = '';
    const list = filter === 'all' ? notifications : notifications.filter((n) => categoryOf(n) === filter);
    if (!list.length) {
      const none = document.createElement('div');
      none.style.cssText = 'font-size:13px;color:var(--ink-soft);text-align:center;padding:2rem 0;';
      none.textContent = 'No notifications in this category.';
      view.appendChild(none);
      return;
    }
    list.forEach((n) => {
      const item = document.createElement('div');
      item.className = 'notif-item' + (n.read ? '' : ' unread');
      const icon = document.createElement('div');
      icon.className = 'notif-icon';
      icon.textContent = ICONS[categoryOf(n)];
      const content = document.createElement('div');
      content.className = 'notif-content';
      const title = document.createElement('div');
      title.className = 'notif-title';
      title.textContent = n.title;
      const desc = document.createElement('div');
      desc.className = 'notif-desc';
      desc.textContent = n.message;
      const time = document.createElement('div');
      time.className = 'notif-time';
      time.textContent = when(n.created_at);
      content.appendChild(title);
      content.appendChild(desc);
      content.appendChild(time);
      item.appendChild(icon);
      item.appendChild(content);
      if (!n.read) {
        const dot = document.createElement('span');
        dot.className = 'unread-dot';
        item.appendChild(dot);
      }
      view.appendChild(item);
    });
  }

  const activeFilter = () => document.querySelector('.filter-chip.active').dataset.cat;

  async function load() {
    state('loading');
    try {
      notifications = (await KQ.api('/notifications')).data || [];
      if (!notifications.length) { state('empty'); return; }
      render(activeFilter());
      state('loaded');
    } catch (error) {
      console.error('Notifications error:', error);
      if (error.kind === 'auth') return;
      $('errorSub').textContent = KQ.describeError(error, 'load notifications');
      state('error');
    }
  }

  document.querySelectorAll('.filter-chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach((c) => c.classList.remove('active'));
      chip.classList.add('active');
      render(chip.dataset.cat);
    });
  });

  $('markAllReadBtn').addEventListener('click', async () => {
    try {
      await KQ.api('/notifications/read-all', { method: 'POST' });
      notifications.forEach((n) => { n.read = true; });
      render(activeFilter());
    } catch (error) {
      $('errorSub').textContent = KQ.describeError(error, 'update notifications');
      state('error');
    }
  });
  $('retryBtn').addEventListener('click', load);

  KQ.mountAuthUI();
  load();
})();
</script>

<script data-component="navigation-inline-js">
(function () {
  'use strict';

  const pages = [
    { n:'01', label:'Landing / Home', file:'page01-landing.html', group:'Farmer portal' },
    { n:'02', label:'Farmer registration', file:'page02-farmer-registration.html', group:'Farmer portal' },
    { n:'03', label:'Slot booking', file:'page03-slot-booking.html', group:'Farmer portal' },

    { n:'08', label:'Live queue', file:'page08-live-queue.html', group:'Farmer portal' },
    { n:'09', label:'Notifications', file:'page09-notifications.html', group:'Farmer portal' },
    { n:'10', label:'Alerts', file:'page10-alerts.html', group:'Farmer portal' },
    { n:'11', label:'Staff login', file:'page11-staff-login.html', group:'Operations & staff' },
    { n:'12', label:'Operations dashboard', file:'page12-operations-dashboard.html', group:'Operations & staff' },
    { n:'13', label:'Queue console', file:'page13-queue-console.html', group:'Operations & staff' },
    { n:'14', label:'Status management', file:'page14-status-management.html', group:'Operations & staff' },
    { n:'15', label:'Reports & analytics', file:'page15-reports-analytics.html', group:'Operations & staff' },
    { n:'16', label:'Settings', file:'page16-settings.html', group:'Operations & staff' }
  ];

  const currentFile = location.pathname.split(/[\\/]/).pop() || 'page01-landing.html';

  function logoHTML(extraClass) {
    return '<a class="kq-brand-wrap" href="page01-landing.html" aria-label="Farmer Queue home">' +
      '<img class="kq-brand-logo ' + (extraClass || '') + '" src="farmer-queue.png" alt="Farmer Queue">' +
      '</a>';
  }

  function addNavigation() {
    document.body.classList.add('kq-enhanced');

    const menu = document.createElement('button');
    menu.className = 'kq-menu-btn';
    menu.type = 'button';
    menu.setAttribute('aria-label', 'Open navigation menu');
    menu.setAttribute('aria-expanded', 'false');
    menu.innerHTML = '<span class="kq-menu-icon"><span></span><span></span><span></span></span>';
    document.body.appendChild(menu);

    const backdrop = document.createElement('div');
    backdrop.className = 'kq-drawer-backdrop';
    document.body.appendChild(backdrop);

    const drawer = document.createElement('aside');
    drawer.className = 'kq-drawer';
    drawer.setAttribute('aria-label', 'Main navigation');

    const groups = ['Farmer portal', 'Operations & staff'];
    let nav = '';
    groups.forEach(group => {
      nav += '<section class="kq-nav-group"><div class="kq-nav-label">' + group + '</div>';
      pages.filter(p => p.group === group).forEach(p => {
        const active = p.file === currentFile;
        nav += '<a class="kq-nav-link' + (active ? ' active' : '') + '" href="' + p.file + '"' + (active ? ' aria-current="page"' : '') + '>' +
          '<span>' + p.label + '</span></a>';
      });
      nav += '</section>';
    });

    drawer.innerHTML =
      '<div class="kq-drawer-head">' + logoHTML('') + '</div>' +
      '<div class="kq-nav-scroll">' + nav + '</div>' +
      '';
    document.body.appendChild(drawer);

    function setOpen(open) {
      drawer.classList.toggle('is-open', open);
      backdrop.classList.toggle('is-open', open);
      menu.classList.toggle('is-open', open);
      menu.setAttribute('aria-expanded', String(open));
      menu.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
    }
    menu.addEventListener('click', () => setOpen(!drawer.classList.contains('is-open')));
    backdrop.addEventListener('click', () => setOpen(false));
    drawer.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
  }

  function applyBranding() {
    const brands = document.querySelectorAll('header .brand, .topbar .brand');
    brands.forEach(el => {
      el.innerHTML = logoHTML('');
    });

    // Every screen gets a persistent, clickable logo. Existing page headers
    // are upgraded in-place; the login screen receives a matching brand.
    if (currentFile === 'page11-staff-login.html' && !document.querySelector('.kq-login-brand')) {
      const loginBrand = document.createElement('div');
      loginBrand.className = 'kq-login-brand';
      loginBrand.innerHTML = '<a href="page01-landing.html" aria-label="Farmer Queue home"><img src="farmer-queue.png" alt="Farmer Queue"></a>';
      document.body.appendChild(loginBrand);
    }
  }

  function wireCoreLinks() {
    const map = {
      startBookingBtn: 'page03-slot-booking.html',
      checkStatusBtn: 'page05-procurement-status.html',
      searchCentreBtn: 'page07-centre-finder.html',
      viewTokenBtn: 'page04-booking-token.html',
      viewTokenFromDashboard: 'page04-booking-token.html',
      doneBtn: 'page01-landing.html',
      bookFromEmpty: 'page03-slot-booking.html',
      rebookFromCancelled: 'page03-slot-booking.html',
      rebookFromExpired: 'page03-slot-booking.html'
    };
    Object.keys(map).forEach(id => {
      let el = document.getElementById(id);
      if (!el || el.dataset.kqWired) return;
      // Replace only these navigation CTAs so prototype alert/demo handlers do not
      // fire before the user is taken to the connected screen.
      const clean = el.cloneNode(true);
      el.replaceWith(clean);
      el = clean;
      el.dataset.kqWired = '1';
      el.addEventListener('click', () => { location.href = map[id]; });
    });

    document.querySelectorAll('.back-link').forEach(a => {
      a.href = 'page01-landing.html';
      a.removeAttribute('onclick');
    });

    const staffLogin = document.querySelector('.login-link');
    if (staffLogin) {
      staffLogin.href = 'page11-staff-login.html';
      staffLogin.removeAttribute('onclick');
    }
  }

  function init() {
    addNavigation();
    applyBranding();
    wireCoreLinks();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
